const $=s=>document.querySelector(s);

const NEW_LIMIT=8;
const dayNum=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=Object.assign({cards:{},days:{},gram:{},nt:{d:0,n:0},place:null,sp:{}},JSON.parse(localStorage.getItem('dfi')||'{}'));
const save=()=>localStorage.setItem('dfi',JSON.stringify(S));
function act(k,n=1){const d=dayNum();S.days[d]=S.days[d]||{};S.days[d][k]=(S.days[d][k]||0)+n;save();}
function streak(){let d=dayNum(),n=0;const has=x=>{const o=S.days[x];return o&&(o.w||o.g||o.s||o.h)};if(!has(d))d--;while(has(d)){n++;d--;}return n;}

const VB={},ORDER=[];
VOCAB.forEach(r=>{VB[r[1]]={deck:r[0],de:r[1],en:r[2],ex:r[3]};});
(function(){const by={};VOCAB.forEach(r=>(by[r[0]]=by[r[0]]||[]).push(r[1]));const ks=Object.keys(by);let i=0,more=true;while(more){more=false;ks.forEach(k=>{if(by[k][i]){ORDER.push(by[k][i]);more=true;}});i++;}})();
const spoken=de=>de.split(',')[0].replace(/\(.*?\)/g,'').trim();

/* ================= SPEECH ================= */
let voice=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().replace('_','-').startsWith('de'));voice=v.find(x=>x.localService)||v[0]||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t,slow){if(!('speechSynthesis' in window)){alert('Speech not supported on this browser.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(voice)u.voice=voice;u.rate=slow?0.6:0.9;speechSynthesis.speak(u);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say,b.dataset.slow==='1');});

/* ================= NAV ================= */
const TABS=[['today','🏠','Heute'],['words','🃏','Wörter'],['gram','✏️','Grammatik'],['speak','🎙','Sprechen'],['more','📊','Mehr']];
let view='today';
function go(v){view=v;render();window.scrollTo(0,0);}
function render(){$('#nav').innerHTML=TABS.map(t=>`<button class="${view===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}<br>${t[2]}</button>`).join('');({today:vToday,words:vWords,gram:vGram,speak:vSpeak,more:vMore,dict:vDict,place:vPlace})[view]();}

/* ================= TODAY ================= */
function vToday(){
  const d=S.days[dayNum()]||{};
  const nDue=dueList('').length,nNew=newList('').length;
  const T=(ti,sub,done,btn,fn)=>`<div class="card"><div class="row" style="align-items:center"><div style="flex:3"><b>${done?'✅ ':''}${ti}</b><div class="mut">${sub}</div></div><button class="${done?'':'p'}" onclick="${fn}">${btn}</button></div></div>`;
  root.innerHTML=`<h1>Guten Tag! 👋</h1><p class="mut">🔥 Streak: ${streak()} day(s) · Goal: 10–20 minutes</p>
  ${T('🃏 Words',`${nDue} due · ${nNew} new · about 6 min`,(d.w||0)>=10,'Start',"startWords('')")}
  ${T('✏️ Grammar','5 questions · about 3 min',(d.g||0)>=5,'Start','startGram()')}
  ${T('🎙 Speaking','1 scenario, out loud · about 5 min',(d.s||0)>=1,'Start','SP=nextSp();go(\'speak\')')}
  ${T('👂 Dictation','3 sentences · about 3 min',(d.h||0)>=3,'Start','startDict()')}
  ${S.place?'':`<div class="card"><b>📋 Not tested yet</b><div class="mut">Take the 17-question placement test (5 min) to estimate your level.</div><br><button onclick="startPlace()">Take placement test</button></div>`}
  <div class="card mut">Tip: always say the German <b>out loud</b>. Understanding is easy, producing is the skill that gets you the job.</div>`;
}

/* ================= WORDS (SRS) ================= */
let Q=null,wd='';
function newAvail(){const t=dayNum();if(S.nt.d!==t)S.nt={d:t,n:0};return Math.max(0,NEW_LIMIT-S.nt.n);}
function dueList(deck){const t=dayNum();return Object.keys(S.cards).filter(id=>VB[id]&&S.cards[id].due<=t&&(!deck||VB[id].deck===deck));}
function newList(deck){return ORDER.filter(id=>!S.cards[id]&&(!deck||VB[id].deck===deck)).slice(0,newAvail());}
function startWords(deck){
  const due=dueList(deck).sort(()=>Math.random()-.5).slice(0,25),nw=newList(deck);
  Q={queue:due.concat(nw),total:due.length+nw.length,show:false,rev:false};
  flags();go('words');
}
function flags(){const id=Q.queue[0],st=id&&S.cards[id];Q.rev=!!(st&&st.reps>=1&&Math.random()<0.5);Q.show=false;}
function showCard(){Q.show=true;vWordsCard();say(spoken(Q.queue[0]));}
function rateCard(q){
  const id=Q.queue.shift(),t=dayNum();
  let c=S.cards[id];
  if(!c){c=S.cards[id]={ease:2.5,int:0,reps:0,due:t};S.nt.n++;}
  if(q===0){c.reps=0;c.int=0;c.ease=Math.max(1.3,c.ease-.2);c.due=t;Q.queue.push(id);}
  else{
    if(c.reps===0)c.int=q===3?3:1;
    else if(c.reps===1)c.int=q===3?7:q===1?3:5;
    else c.int=Math.max(c.int+1,Math.round(c.int*c.ease*(q===1?.7:q===3?1.3:1)));
    if(q===1)c.ease=Math.max(1.3,c.ease-.15);
    if(q===3)c.ease+=.15;
    c.reps++;c.due=t+c.int;
  }
  save();act('w');flags();vWordsCard();
}
function vWords(){
  if(Q)return vWordsCard();
  const ids=Object.keys(S.cards).filter(k=>VB[k]);
  const chips=['','Arbeit','Technik','Alltag'].map(k=>`<button class="${wd===k?'p':''}" onclick="wd='${k}';vWords()">${k||'All'}</button>`).join('');
  const lists=['Arbeit','Technik','Alltag'].map(dk=>{const items=VOCAB.filter(r=>r[0]===dk);return `<details><summary><b>${dk}</b> (${items.length})</summary>${items.map(r=>`<div class="li"><b>${esc(r[1])}</b> – ${esc(r[2])}<button data-say="${esc(spoken(r[1]))}">🔊</button></div>`).join('')}</details>`;}).join('');
  root.innerHTML=`<h1>🃏 Words</h1><div class="card"><div class="row">${chips}</div><p>${dueList(wd).length} due · ${newList(wd).length} new today · ${ids.length}/${VOCAB.length} started</p><button class="p" style="width:100%" onclick="startWords(wd)">Start session</button></div><div class="card"><h2>Browse all</h2>${lists}</div>`;
}
function vWordsCard(){
  if(!Q.queue.length){root.innerHTML=`<div class="card"><h1>✅ Session done!</h1><p>Come back tomorrow. Spaced repetition works because of the gaps.</p><button class="p" onclick="Q=null;go('today')">Back</button></div>`;return;}
  const id=Q.queue[0],c=VB[id],left=Q.queue.length,pct=Math.round((1-left/Math.max(Q.total,left))*100);
  const front=Q.rev?`<div class="mut">Say it in German, out loud!</div><div class="big">${esc(c.en)}</div>`:`<div class="big">${esc(c.de)} <button data-say="${esc(spoken(c.de))}">🔊</button></div>`;
  const back=Q.show?`<hr>${Q.rev?`<div class="big">${esc(c.de)} <button data-say="${esc(spoken(c.de))}">🔊</button></div>`:`<div class="big" style="font-size:20px">${esc(c.en)}</div>`}<p>${esc(c.ex)} <button data-say="${esc(c.ex)}">🔊</button></p><p class="mut">Read the example aloud once.</p>`:'';
  const btns=Q.show?`<div class="row"><button onclick="rateCard(0)">Again</button><button onclick="rateCard(1)">Hard</button><button onclick="rateCard(2)">Good</button><button onclick="rateCard(3)">Easy</button></div>`:`<button class="p" style="width:100%" onclick="showCard()">Show answer</button>`;
  root.innerHTML=`<div class="mut">${c.deck} · ${left} left</div><div class="bar"><i style="width:${pct}%"></i></div><div class="card">${front}${back}</div>${btns}<br><button onclick="Q=null;go('words')">Quit session</button>`;
}

/* ================= GRAMMAR ================= */
let G=null;
function startGram(){
  const list=GRAM.map((q,i)=>{const g=S.gram[i];return [i,(g?g.ok-2*g.no:-0.5)+Math.random()*1.5];}).sort((a,b)=>a[1]-b[1]).slice(0,5).map(x=>x[0]);
  G={list,i:0,score:0};prepG();go('gram');
}
function prepG(){const q=GRAM[G.list[G.i]];G.opts=q.o.map((t,k)=>({t,c:k===0})).sort(()=>Math.random()-.5);G.ans=null;}
function ansG(k){
  if(G.ans!==null)return;G.ans=k;
  const qi=G.list[G.i],q=GRAM[qi],g=S.gram[qi]=S.gram[qi]||{ok:0,no:0};
  if(G.opts[k].c){g.ok++;G.score++;}else g.no++;
  save();act('g');vGramQ();say(q.q.replace('___',q.o[0]));
}
function nextG(){G.i++;if(G.i<G.list.length)prepG();vGramQ();}
function vGram(){
  if(G)return vGramQ();
  let ok=0,no=0;Object.values(S.gram).forEach(g=>{ok+=g.ok;no+=g.no;});
  root.innerHTML=`<h1>✏️ Grammar</h1><div class="card"><p>${GRAM.length} questions · Accuracy so far: ${ok+no?Math.round(100*ok/(ok+no)):'–'}%</p><p class="mut">Questions you got wrong come back more often. Read the explanation, then read the full sentence aloud.</p><button class="p" style="width:100%" onclick="startGram()">Start 5 questions</button></div>`;
}
function vGramQ(){
  if(G.i>=G.list.length){root.innerHTML=`<div class="card"><h1>Score: ${G.score}/${G.list.length}</h1><button class="p" onclick="G=null;go('today')">Back</button> <button onclick="startGram()">Again</button></div>`;return;}
  const q=GRAM[G.list[G.i]],a=G.ans!==null;
  const sentence=esc(q.q).replace('___',a?`<b class="g">${esc(q.o[0])}</b>`:'<b>_____</b>');
  root.innerHTML=`<div class="mut">Question ${G.i+1}/${G.list.length}</div><div class="bar"><i style="width:${G.i/G.list.length*100}%"></i></div><div class="card"><div class="big" style="font-size:20px">${sentence}</div>${G.opts.map((o,k)=>`<button class="opt ${a?(o.c?'ok':(G.ans===k?'no':'')):''}" onclick="ansG(${k})">${esc(o.t)}</button>`).join('')}${a?`<p class="mut">💡 ${esc(q.e)}</p><button class="p" style="width:100%" onclick="nextG()">Next</button>`:''}</div>`;
}

/* ================= SPEAKING ================= */
let SP=null,rec=null,chunks=[];
function nextSp(){let best=0,bc=1e9;SPEAK.forEach((s,i)=>{const c=S.sp[i]||0;if(c<bc){bc=c;best=i;}});return best;}
function vSpeak(){
  if(SP!==null)return vSpeakDetail();
  root.innerHTML=`<h1>🎙 Speaking</h1><p class="mut">Pick a situation. You speak first, then compare.</p>`+SPEAK.map((s,i)=>`<div class="card" onclick="SP=${i};vSpeak()"><b>${esc(s.t)}</b><div class="mut">practiced ${S.sp[i]||0}×</div></div>`).join('');
}
function vSpeakDetail(){
  const s=SPEAK[SP];
  root.innerHTML=`<button onclick="SP=null;vSpeak()">← Back</button>
  <div class="card"><h2>${esc(s.t)}</h2><p>${esc(s.sit)}</p><p class="mut"><b>Step 1.</b> Say your answer aloud in German, 20–30 seconds, even if imperfect. Use your own words.</p><button id="recbtn" onclick="toggleRec()">🎙 Record myself</button><audio id="myrec" controls style="display:none;width:100%;margin-top:8px"></audio></div>
  <div class="card"><p class="mut"><b>Step 2.</b> Show the model answer and listen. What did you miss?</p><div id="model"></div><button id="revbtn" onclick="revModel()">Show model answer</button></div>
  <div class="card"><p class="mut"><b>Step 3. Shadowing:</b> play the model and speak <i>along</i> with it, 3 times. Then record yourself again.</p><button class="p" style="width:100%" onclick="doneSpeak()">✅ I practiced this</button></div>`;
}
function revModel(){
  const s=SPEAK[SP];
  $('#model').innerHTML=`<p style="font-size:18px">${esc(s.model)}</p><div class="row"><button data-say="${esc(s.model)}">🔊 Normal</button><button data-say="${esc(s.model)}" data-slow="1">🐢 Slow</button></div><p class="mut"><b>Useful chunks:</b><br>${s.tips.map(t=>'• '+esc(t)).join('<br>')}</p>`;
  $('#revbtn').style.display='none';
}
async function toggleRec(){
  const btn=$('#recbtn');
  if(rec&&rec.state==='recording'){rec.stop();btn.textContent='🎙 Record again';return;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(st);chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());const a=$('#myrec');if(a){a.src=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));a.style.display='block';}};
    rec.start();btn.textContent='⏹ Stop';
  }catch(e){alert('Microphone not available: '+e.message+'\nYou can still practice by speaking aloud without recording.');}
}
function doneSpeak(){act('s');S.sp[SP]=(S.sp[SP]||0)+1;save();SP=null;go('today');}

/* ================= DICTATION ================= */
let D=null;
const norm=w=>w.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'');
function startDict(){const ids=Object.keys(VB).sort(()=>Math.random()-.5).slice(0,3);D={list:ids.map(i=>VB[i].ex),i:0,res:null,typed:''};go('dict');setTimeout(()=>say(D.list[0]),300);}
function checkDict(){
  const typed=$('#dt').value;D.typed=typed;
  const set=new Set(typed.trim().split(/\s+/).map(norm)),words=D.list[D.i].split(/\s+/);
  let ok=0;
  const html=words.map(w=>{const good=set.has(norm(w));if(good)ok++;return `<span class="${good?'g':'r'}">${esc(w)}</span>`;}).join(' ');
  D.res=`${html}<br><span class="mut">${ok}/${words.length} words found</span>`;
  act('h');vDict();
}
function nextDict(){D.i++;D.res=null;D.typed='';vDict();if(D.i<D.list.length)say(D.list[D.i]);}
function vDict(){
  if(!D)return go('today');
  if(D.i>=D.list.length){root.innerHTML=`<div class="card"><h1>✅ Dictation done</h1><button class="p" onclick="D=null;go('today')">Back</button></div>`;return;}
  const s=D.list[D.i];
  root.innerHTML=`<h2>👂 Dictation ${D.i+1}/${D.list.length}</h2><div class="card"><div class="row"><button data-say="${esc(s)}">🔊 Play</button><button data-say="${esc(s)}" data-slow="1">🐢 Slow</button></div><p class="mut">Type what you hear. Umlauts optional (ae = ä).</p><textarea id="dt" rows="2">${esc(D.typed)}</textarea>${D.res?`<p>${D.res}</p><button class="p" style="width:100%" onclick="nextDict()">Next</button>`:`<button class="p" style="width:100%" onclick="checkDict()">Check</button>`}</div><button onclick="D=null;go('today')">Quit</button>`;
}

/* ================= PLACEMENT TEST ================= */
let PT=null;
function prepP(){const q=PLACE[PT.i];PT.opts=q.o.map((t,k)=>({t,c:k===0})).sort(()=>Math.random()-.5);PT.opts.push({t:"I don't know",c:false});}
function startPlace(){PT={i:0,sc:{},tot:{}};PLACE.forEach(q=>{PT.tot[q.l]=(PT.tot[q.l]||0)+1;PT.sc[q.l]=0;});prepP();go('place');}
function ansP(k){
  if(PT.opts[k].c)PT.sc[PLACE[PT.i].l]++;
  PT.i++;
  if(PT.i>=PLACE.length){
    let est='below A2';
    for(const l of ['A2','B1','B2','C1']){if(PT.sc[l]/PT.tot[l]>=0.6)est=l;else break;}
    S.place={est,sc:PT.sc,tot:PT.tot,date:new Date().toLocaleDateString()};save();
  }else prepP();
  vPlace();
}
function vPlace(){
  if(!PT)return go('more');
  if(PT.i>=PLACE.length){
    const p=S.place,adv={'below A2':'Start with core B1 basics: cases, word order, Perfekt.','A2':'Build B1 basics: Nebensätze, Perfekt/Präteritum, Dativ/Akkusativ.','B1':'Solid base. Next: Konjunktiv II, Passiv, Relativsätze, connectors.','B2':'Good. Work on fluency and speed, Nominalisierung and formal register.','C1':'Strong. Focus on speaking fluency and job-specific vocabulary.'}[p.est];
    root.innerHTML=`<div class="card"><h1>Estimated level: ${p.est}</h1><p>${['A2','B1','B2','C1'].map(l=>`${l}: ${p.sc[l]}/${p.tot[l]}`).join(' · ')}</p><p>${adv}</p><p class="mut">This is a rough grammar-only estimate, not an official result. Speaking and listening may differ.</p><button class="p" onclick="PT=null;go('today')">Done</button></div>`;return;
  }
  const q=PLACE[PT.i];
  root.innerHTML=`<div class="mut">Question ${PT.i+1}/${PLACE.length}</div><div class="bar"><i style="width:${PT.i/PLACE.length*100}%"></i></div><div class="card"><div class="big" style="font-size:20px">${esc(q.q).replace('___','_____')}</div>${PT.opts.map((o,k)=>`<button class="opt" onclick="ansP(${k})">${esc(o.t)}</button>`).join('')}</div><button onclick="if(confirm('Quit test?')){PT=null;go('more')}">Quit</button>`;
}

/* ================= MORE ================= */
function vMore(){
  const ids=Object.keys(S.cards).filter(k=>VB[k]),mature=ids.filter(k=>S.cards[k].int>=21).length;
  let ok=0,no=0;Object.values(S.gram).forEach(g=>{ok+=g.ok;no+=g.no;});
  const active=Object.keys(S.days).length;
  root.innerHTML=`<h1>📊 Progress</h1><div class="card"><p>🔥 Streak: <b>${streak()}</b> days · Active days: <b>${active}</b></p><p>🃏 Words started: <b>${ids.length}</b>/${VOCAB.length} · Mature (21+ days): <b>${mature}</b></p><p>✏️ Grammar accuracy: <b>${ok+no?Math.round(100*ok/(ok+no)):'–'}%</b> (${ok+no} answers)</p><p>🎙 Speaking sessions: <b>${Object.values(S.sp).reduce((a,b)=>a+b,0)}</b></p><p>📋 Placement: <b>${S.place?S.place.est+' ('+S.place.date+')':'not taken'}</b></p><button onclick="startPlace()">Take / retake placement test</button></div>
  <div class="card"><h2>Backup</h2><p class="mut">Progress is stored on this phone. Export a backup now and then.</p><div class="row"><button onclick="exportData()">⬇ Export</button><button onclick="$('#imp').click()">⬆ Import</button></div><input type="file" id="imp" accept=".json" style="display:none" onchange="importData(this)"><br><button onclick="if(confirm('Delete ALL progress?')){localStorage.removeItem('dfi');location.reload()}">Reset everything</button></div>
  <div class="card mut"><h2>🔊 No German voice?</h2>Android: Settings → search “Text-to-speech” → Google Speech Services (or Speech Recognition &amp; Synthesis) → Settings → Install voice data → Deutsch. Then restart the app.</div>`;
}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='deutsch-progress.json';a.click();}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();alert('Imported!');render();}catch(e){alert('Invalid file');}};r.readAsText(f);}

render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
